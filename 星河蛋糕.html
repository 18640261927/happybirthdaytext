/* ---------------- voice wish: appears at the end of the card ---------------- */
const Voice = (() => {
  const box = $("#bc-voice"),
    audio = $("audio", box),
    btn = $(".bc-vbtn", box),
    bar = $(".bc-vbar i", box),
    time = $(".bc-vtime", box),
    music = $("#background-music");
  let revealT = null,
    duck = null;
  const fmt = (x) => (isFinite(x) && x > 0 ? `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, "0")}` : "0:00");
  // lower the background music while the voice plays, then bring it back
  const fadeMusic = (to) => {
    if (window.__parentMusic) {
      try { parent.postMessage({ key: "bgm-volume", to }, "*"); } catch {}
      return;
    }
    clearInterval(duck);
    duck = setInterval(() => {
      const v = music.volume + (to - music.volume) * 0.25;
      music.volume = Math.abs(v - to) < 0.02 ? to : v;
      music.volume === to && clearInterval(duck);
    }, 40);
  };
  const syncBtn = () => {
    const on = !audio.paused;
    box.classList.toggle("is-playing", on);
    btn.setAttribute("aria-label", on ? "暂停语音祝福" : "播放语音祝福");
  };
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    audio.paused ? audio.play().catch(() => {}) : audio.pause();
  });
  audio.addEventListener("play", () => (syncBtn(), fadeMusic(0.15)));
  audio.addEventListener("pause", () => (syncBtn(), fadeMusic(1)));
  audio.addEventListener("ended", () => {
    audio.currentTime = 0;
    bar.style.width = "0%";
  });
  audio.addEventListener("loadedmetadata", () => (time.textContent = fmt(audio.duration)));
  audio.addEventListener("timeupdate", () => {
    const d = audio.duration;
    bar.style.width = isFinite(d) && d > 0 ? (audio.currentTime / d) * 100 + "%" : "0%";
    time.textContent = fmt(audio.paused ? d : audio.currentTime);
  });
  return {
    set(src) {
      audio.pause();
      src ? (audio.src = src) : audio.removeAttribute("src");
      box.classList.toggle("has-voice", !!src);
      time.textContent = "0:00";
      bar.style.width = "0%";
    },
    reveal(delay = 0) {
      clearTimeout(revealT);
      revealT = setTimeout(() => box.classList.add("is-in"), delay);
    },
    conceal() {
      clearTimeout(revealT);
      box.classList.remove("is-in");
      audio.pause();
    },
  };
})();

/* ---------------- the glass blessing card (as in the original page) ---------------- */
const BCard = (() => {
  const el = $("#blessing-card"),
    tilt = $(".bc-tilt", el),
    box = $("#bc-lines", el);
  let shown = !1,
    lines = [],
    typeTimer = null,
    typeDelay = null;
  function build() {
    // keep the spacing typed in the editor: a line pushed right with leading spaces sits on the right of the card,
    // one followed by trailing spaces sits on the left, everything else stays centred
    const wsw = (s) => Array.from(s).reduce((n, c) => n + (c === "\t" ? 4 : c === "\u3000" ? 2 : 1), 0);
    const raw = String(S.letter || "").replace(/\r/g, "").split("\n").filter((t) => t.trim());
    const rows = raw.map((r) => r.trim());
    const aligns = raw.map((r) => {
      const lead = wsw(r.match(/^[ \t\u3000]*/)[0]), trail = wsw(r.match(/[ \t\u3000]*$/)[0]);
      return lead >= 4 && lead > trail ? "right" : trail >= 4 && trail > lead ? "left" : "";
    });
    box.innerHTML = "";
    lines = rows.map((t, i) => {
      // titleMode "auto" (heart editions): only a salutation-looking first line gets the title style
      const first = i === 0 && (S.titleMode !== "auto" || /^(to\s|致|亲爱的|dear\s)|[：:]$/i.test(t)),
        last = i === rows.length - 1 && rows.length > 2;
      const n = document.createElement(first || last ? "div" : "p");
      n.className = "bc-line" + (first ? " bc-to" : last ? " bc-sign" : Array.from(t).length <= 4 ? " bc-em" : "");
      n.dataset.text = t.slice(0, 120);
      aligns[i] && (n.style.textAlign = aligns[i]);
      box.appendChild(n);
      return n;
    });
    const fill = shown && !typeTimer && !typeDelay;
    lines.forEach((n) => (n.textContent = fill ? n.dataset.text : ""));
  }
  function stop() {
    clearInterval(typeTimer);
    clearTimeout(typeTimer);
    clearTimeout(typeDelay);
    typeTimer = typeDelay = null;
    lines.forEach((n) => n.classList.remove("typing"));
  }
  function type() {
    stop();
    if (REDUCED) return lines.forEach((n) => (n.textContent = n.dataset.text)), Voice.reveal();
    lines.forEach((n) => (n.textContent = ""));
    let i = 0;
    const next = () => {
      if (i >= lines.length) return (typeTimer = null), Voice.reveal(450);
      const n = lines[i],
        chars = Array.from(n.dataset.text || "");
      n.classList.add("typing");
      let k = 0;
      typeTimer = setInterval(() => {
        n.textContent = chars.slice(0, ++k).join("");
        if (k >= chars.length) {
          clearInterval(typeTimer);
          n.classList.remove("typing");
          i++;
          typeTimer = setTimeout(next, 260);
        }
      }, 55);
    };
    next();
  }
  function show({ animate = !0 } = {}) {
    shown = !0;
    el.classList.add("is-shown");
    el.setAttribute("aria-hidden", "false");
    stop();
    if (animate) {
      lines.forEach((n) => (n.textContent = ""));
      typeDelay = setTimeout(() => ((typeDelay = null), type()), 700);
    } else lines.forEach((n) => (n.textContent = n.dataset.text)), Voice.reveal();
    sync();
  }
  function hide() {
    shown = !1;
    el.classList.remove("is-shown");
    Voice.conceal();
    el.setAttribute("aria-hidden", "true");
    stop();
    setTimeout(() => shown || lines.forEach((n) => (n.textContent = "")), 900);
    sync();
  }
  function sync() {
    const b = $("#be-open");
    if (!b) return;
    b.textContent = shown ? "收起贺卡" : "预览贺卡";
    status(shown ? "贺卡已经打开。" : "贺卡还合着。");
  }

  /* hover: the glass card leans toward the cursor and catches the light */
  const t = { rx: 0, ry: 0, tx: 0, ty: 0, gx: 50, gy: 30, ga: 0, ta: 0 };
  el.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    const r = tilt.getBoundingClientRect(),
      px = (e.clientX - r.left) / r.width,
      py = (e.clientY - r.top) / r.height;
    t.tx = (0.5 - py) * 12;
    t.ty = (px - 0.5) * 16;
    t.gx = px * 100;
    t.gy = py * 100;
    t.ta = 1;
  });
  el.addEventListener("pointerleave", () => ((t.tx = t.ty = 0), (t.ta = 0)));
  (function loop() {
    requestAnimationFrame(loop);
    t.rx += (t.tx - t.rx) * 0.09;
    t.ry += (t.ty - t.ry) * 0.09;
    t.ga += (t.ta - t.ga) * 0.08;
    tilt.style.transform = `rotateX(${t.rx.toFixed(2)}deg) rotateY(${t.ry.toFixed(2)}deg)`;
    tilt.style.setProperty("--gx", t.gx.toFixed(1) + "%");
    tilt.style.setProperty("--gy", t.gy.toFixed(1) + "%");
    tilt.style.setProperty("--ga", t.ga.toFixed(3));
  })();
  return { show, hide, build, isShown: () => shown };
})();

function readFile(file, max) {
  return new Promise((res, rej) => {
    if (!file) return rej(Error("未选择文件"));
    if (file.size > max) return rej(Error(`文件过大，建议不超过 ${Math.round(max / 1048576)}MB`));
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(Error("读取文件失败"));
    r.readAsDataURL(file);
  });
}

/* photo */
async function setPhotoFile(file) {
  if (!$("#be-photo")) return;
  if (!file || !/^image\//.test(file.type)) return;
  try {
    const raw = await readFile(file, 30 * 1048576);
    const im = await new Promise((r, j) => {
      const i = new Image();
      i.onload = () => r(i);
      i.onerror = j;
      i.src = raw;
    });
    // shrink large photos so the exported file stays light
    const k = Math.min(1, 1080 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(im.naturalWidth * k);
    c.height = Math.round(im.naturalHeight * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    S.photo = c.toDataURL("image/jpeg", 0.82);
    PhotoFrame.apply();
    update();
    status("照片已放好，导出 HTML 时会一起打包。");
  } catch (e) {
    status(e.message || "这张图片读不出来，换一张试试。");
  }
}

  a.download = (() => { const first = (String(S.letter || "").split("\n").find((x) => x.trim()) || "").trim().replace(/[\\/:*?"<>|\r\n]/g, "").replace(/[，,。.！!、；;~～\s]+$/, "").slice(0, 30).replace(/^生日快乐[，,。.！!、~～\s-]*/, ""); return first ? `生日快乐-${first}.html` : "生日快乐.html"; })();
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  status("专属单文件已导出，直接发给 TA 就能打开。");
});
addEventListener("pagehide", () => {
  blobs.forEach((u) => URL.revokeObjectURL(u));
  recStream?.getTracks().forEach((t) => t.stop());
});
} // end studio

/* ---------------- blowing out the candle ---------------- */
(() => {
  const colors = ["#ff6ea8", "#ffd166", "#6ec6ff", "#9b8cff", "#ff8fab", "#fff1a8", "#7CFFB2"];
  function celebrate() {
    const end = Date.now() + 3000;
    (function frame() {
      confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors });
      confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors });
      Date.now() < end && requestAnimationFrame(frame);
    })();
    confetti({ particleCount: 160, spread: 100, origin: { y: 0.55 }, colors });
  }
  const glyphs = ["✦", "⋆", "✧", "·", "✶"],
    field = runtime(document.createElement("div"));
  field.className = "bc-starfield";
  field.style.display = "none";
  STAGE.appendChild(field);
  let starTimer = null;
  const starsOn = () => {
    field.style.display = "block";
    starTimer ||
      (starTimer = setInterval(() => {
        const s = document.createElement("span");
        s.className = "bc-star";
        s.textContent = glyphs[(Math.random() * glyphs.length) | 0];
        s.style.left = Math.random() * 100 + "%";
        s.style.fontSize = 8 + Math.random() * 16 + "px";
        s.style.setProperty("--drift", (Math.random() * 2 - 1) * 60 + "px");
        s.style.animationDuration = 3.5 + Math.random() * 3.5 + "s";
        s.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
        field.appendChild(s);
        setTimeout(() => s.remove(), 7200);
      }, 220));
  };
  const starsOff = () => {
    clearInterval(starTimer);
    starTimer = null;
    field.style.display = "none";
    field.innerHTML = "";
  };

  const tip = runtime(document.createElement("div"));
  tip.className = "stage-tip";
  tip.textContent = "点击下方‘吹蜡烛’按钮，熄灭蛋糕上的蜡烛";
  STAGE.appendChild(tip);
  const tipOn = () => (tip.style.opacity = "1"),
    tipOff = () => (tip.style.opacity = "0");
  let blown = !1,
    openTimer = null;
  const blowBtn = $("#blow-btn"),
    continueBtn = $("#continue-to-blessing");
  const markDone = (b) => {
    b.classList.remove("is-active");
    b.classList.add("is-done");
    b.setAttribute("aria-label", "已吹灭");
    b.title = "已吹灭";
    const label = b.querySelector("span");
    if (label) label.textContent = "已吹灭";
  };
  function blow() {
    if (blown) return;
    blown = !0;
    Music.play();
    window.__extinguish && window.__extinguish();
    celebrate();
    tipOff();
    markDone(blowBtn);
    starsOn();
    if (continueBtn) {
      continueBtn.disabled = !1;
      continueBtn.textContent = "继续看祝福";
      continueBtn.classList.add("is-ready");
    }
    window.parent !== window && window.parent.postMessage({ type: "birthday-candle-blown" }, "*");
    openTimer = setTimeout(() => S.noCard || BCard.show(), 3500); // "去掉贺卡": the cake just stays lit-out, no card
  }
  blowBtn.addEventListener("click", (e) => (e.stopPropagation(), blow()));
  $("#reset").addEventListener("click", () => {
    blown = !1;
    clearTimeout(openTimer);
    BCard.hide();
    starsOff();
    window.__relight && window.__relight();
    blowBtn.classList.remove("is-done");
    blowBtn.setAttribute("aria-label", "吹蜡烛");
    blowBtn.title = "吹蜡烛";
    blowBtn.querySelector("span").textContent = "吹蜡烛";
    continueBtn.disabled = !0;
    continueBtn.textContent = "先吹蜡烛";
    continueBtn.classList.remove("is-ready");
    window.parent !== window && window.parent.postMessage({ type: "birthday-candle-reset" }, "*");
    tipOff();
  });
  continueBtn.addEventListener("click", () => {
    if (!blown) return;
    window.parent !== window && window.parent.postMessage({ type: "birthday-open-blessing" }, "*");
  });
  setTimeout(tipOn, 1200);
})();

/* ---------------- cursor star trail over the stage ---------------- */
(() => {
  if (REDUCED) return;
  let last = 0, lx = 0, ly = 0;
  const glyphs = ["✦", "✧", "⋆", "·"];
  STAGE.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || e.buttons) return;
    const now = performance.now();
    const r = STAGE.getBoundingClientRect(),
      x = e.clientX - r.left,
      y = e.clientY - r.top;
    if (now - last < 45 || Math.hypot(x - lx, y - ly) < 16) return;
    if (e.target.closest(".blessing-card.is-shown,.controls")) return;
    last = now; lx = x; ly = y;
    const s = runtime(document.createElement("span"));
    s.className = "trail-star";
    s.textContent = glyphs[(Math.random() * glyphs.length) | 0];
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.fontSize = 7 + Math.random() * 9 + "px";
    s.style.setProperty("--dx", (Math.random() * 2 - 1) * 26 + "px");
    s.style.setProperty("--dy", -10 - Math.random() * 26 + "px");
    STAGE.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  });
})();

/* ---------------- embedded in the heart page: live settings from the outer editor ---------------- */
if (window.parent !== window) {
  addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.key === "cfg" && d.cfg) {
      const prevCake = S.cake + "/" + S.cakeHue;
      S = { ...S, ...d.cfg };
      S.noCard && BCard.isShown() && BCard.hide();
      S.cake + "/" + S.cakeHue !== prevCake && applyCake(!0);
      BCard.build();
      PhotoFrame.apply();
      applyVoice();
    }
    if (d.key === "card") d.show && !S.noCard ? BCard.isShown() || BCard.show({ animate: d.animate !== !1 }) : BCard.hide();
  });
  const post = () => {
    try { parent.postMessage({ key: "card-state", shown: BCard.isShown() }, "*"); } catch {}
  };
  new MutationObserver(post).observe($("#blessing-card"), { attributes: !0, attributeFilter: ["class"] });
}

/* ---------------- boot ---------------- */
applyCake(!1);
BCard.build();
applyVoice();
PhotoFrame.apply();
S.music && Music.setSrc(S.music);
syncControls();

}

</script>

  background:linear-gradient(150deg,#ffffff29,#ffffff0f);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.28);

  max-height:0;opacity:0;transform:translateY(10px);overflow:hidden;transition:max-height .7s cubic-bezier(.2,.8,.25,1),margin-top .7s cubic-bezier(.2,.8,.25,1),padding .7s cubic-bezier(.2,.8,.25,1),opacity .7s ease .1s,transform .7s cubic-bezier(.2,.8,.25,1) .1s}

@media (max-width:899px){
  .studio{top:auto;left:0;width:100%;height:min(78vh,680px);border-left:0;border-top:1px solid rgba(255,255,255,.18);border-radius:20px 20px 0 0;transform:translateY(102%)}
  .st-head::before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:rgba(255,255,255,.2)}
  .st-paper{min-height:180px}
  body.studio-open .controls{opacity:0;pointer-events:none}
}

  .birthday-photo{animation:none}
